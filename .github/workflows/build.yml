name: build

on:
  push:
    branches: [ "main", "phase-*", "fix/**" ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build src/DynamicMochi/DynamicMochi.csproj -c Release
      - name: Publish
        run: dotnet publish src/DynamicMochi/DynamicMochi.csproj -c Release -r win-x64 --self-contained false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: DynamicMochi-win-x64
          path: publish
